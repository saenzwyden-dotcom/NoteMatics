<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NoteMatics Notes</title>
    <link rel="stylesheet" href="Notes.css">
</head>
<body>

    <header class="top-banner">
        <div class="logo-area">
            <img src="img/logo.png" alt="Logo" class="logo-img">
            <div class="header-text">
                <h1>NoteMatics</h1>
                <hr class="header-line">
                <p>Smart note-taking meets seamless schedule reminders.</p>
            </div>
        </div>
    </header>

    <main class="notes-container">
        <h2 id="note-subject-title">SUBJECT</h2>
        <hr class="title-line">

        <textarea id="note-editor" placeholder="Type your notes here..."></textarea>

        <button id="close-btn" class="close-btn">X</button>
    </main>

    <script src="Notes.js"></script>
</body>
</html>
